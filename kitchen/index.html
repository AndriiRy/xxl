<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Конфигуратор кухни</title>
<style>
:root{--bg:#1b1f26;--pan:#232932;--pan2:#2b323d;--bd:#3a4350;--tx:#e6e9ee;--mut:#9aa5b4;--ac:#4dabf7;--ok:#51cf66;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--pan2);border:1px solid var(--bd);border-radius:5px;padding:4px 7px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.pri{background:#1c5d99;border-color:#2b7bc4}button.dng:hover{border-color:var(--bad);color:var(--bad)}
input[type=number]{width:78px}input:focus,select:focus,textarea:focus{outline:1px solid var(--ac)}
header{height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--pan);border-bottom:1px solid var(--bd);overflow-x:auto;white-space:nowrap}
header h1{font-size:15px;margin:0 10px 0 0}header .sp{flex:1}
#app{display:grid;grid-template-columns:290px 1fr 310px;height:calc(100% - 44px)}
aside{background:var(--pan);overflow:auto;display:flex;flex-direction:column}
#left{border-right:1px solid var(--bd)}#right{border-left:1px solid var(--bd);padding:10px}
.tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--bd);background:var(--pan)}
.tabs button{border-radius:5px 5px 0 0;border-bottom:none;background:transparent}.tabs button.on{background:var(--pan2);border-color:var(--ac)}
.pane{display:none;flex:1;min-height:0}.pane.on{display:block}
#center{display:flex;flex-direction:column;min-width:0}
#views{flex:1;position:relative;min-height:0}
#views .pane{position:absolute;inset:0;overflow:auto}
canvas{width:100%;height:100%;display:block;touch-action:none}
.lp{padding:8px;overflow:auto}
.cat{margin:10px 0 4px;color:var(--mut);text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.mod{display:flex;align-items:center;gap:4px;padding:5px 6px;margin:2px 0;background:var(--pan2);border:1px solid var(--bd);border-radius:6px;cursor:grab}
.mod:hover{border-color:var(--ac)}.mod .n{flex:1}.mod small{color:var(--mut)}.mod button{padding:1px 6px}
.row{display:flex;align-items:center;gap:6px;margin:5px 0}.row label{flex:1;color:var(--mut)}
h3{margin:12px 0 6px;font-size:13px}.mut{color:var(--mut)}.err{color:var(--bad);white-space:pre-wrap}.okc{color:var(--ok)}
table.t{border-collapse:collapse;width:100%}table.t td,table.t th{border:1px solid var(--bd);padding:2px;text-align:left;font-weight:normal;color:var(--mut)}
table.t input,table.t select{width:100%;min-width:50px;padding:2px 4px}
table.t select{min-width:74px}
.scroll-x{overflow-x:auto}
#specView{background:#fff;color:#111;padding:18px 26px;font-size:13px}
#specView h1{font-size:20px}#specView h2{font-size:16px;border-bottom:2px solid #222;padding-bottom:3px;margin-top:26px}#specView h3{font-size:13px;margin:14px 0 4px}
#specView table{border-collapse:collapse;margin:6px 0 12px}#specView th,#specView td{border:1px solid #999;padding:3px 7px;text-align:left}#specView th{background:#eee}
.note{color:#666;font-size:11px}.drillgrid{display:flex;flex-wrap:wrap;gap:10px}.pcard{border:1px solid #bbb;padding:6px 8px;max-width:380px;border-radius:5px}.pcard ul{margin:2px 0 0;padding-left:16px;font-size:11px}
#specBar{position:sticky;top:0;background:#eef;padding:6px;margin:-18px -26px 12px;display:flex;gap:6px;border-bottom:1px solid #99a}
#specBar button{color:#111;background:#fff;border-color:#99a}
#paneMod{display:none;flex-direction:column}#paneMod.on{display:flex}
#edTop{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--pan)}
#edBody{flex:1;display:grid;grid-template-columns:1fr 380px;min-height:0}
#edForm{overflow:auto;padding:10px}#edPrev{border-left:1px solid var(--bd);display:flex;flex-direction:column;padding:8px;min-height:0}
#edPrev canvas{flex:1;min-height:200px;background:#10141a;border-radius:6px}
.hint{font-size:11px;color:var(--mut)}
dialog{background:var(--pan);color:var(--tx);border:1px solid var(--bd);border-radius:8px;max-width:560px}dialog::backdrop{background:#0008}
@media print{header,aside,.tabs,#specBar{display:none!important}#app{display:block}#views .pane{position:static}}
@media (max-width:900px){#app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}#left,#right{max-height:40vh}}
</style>
</head>
<body>
<header>
  <h1>🪚 Конфигуратор кухни</h1>
  <button id="bNew">Новый</button><button id="bOpen">Открыть</button><button id="bSave">Сохранить проект</button>
  <button id="bWalls">Стены из Fusion…</button>
  <span class="sp"></span><span id="status" class="mut"></span>
  <button id="bCsv">CSV раскрой</button><button id="bFusion">JSON → Fusion</button><button id="bSettings">Настройки</button><select id="bLang" title="Język / Язык"><option value="ru">RU</option><option value="pl">PL</option></select>
  <input id="fileAny" type="file" accept=".json,.obj,application/json" hidden>
</header>
<div id="app">
  <aside id="left">
    <div class="tabs"><button data-t="lib" class="on">Библиотека</button><button data-t="walls">Стены</button></div>
    <div class="lp pane on" id="tab-lib"></div>
    <div class="lp pane" id="tab-walls"></div>
  </aside>
  <section id="center">
    <div class="tabs" id="ctabs"><button data-v="plan" class="on">План</button><button data-v="v3d">3D</button><button data-v="spec">Спецификация</button><button data-v="mod" id="tabMod" style="display:none">Редактор модуля</button></div>
    <div id="views">
      <div class="pane on" id="paneplan"><canvas id="plan"></canvas></div>
      <div class="pane" id="panev3d"><canvas id="c3d"></canvas></div>
      <div class="pane" id="panespec"><div id="specView"></div></div>
      <div class="pane" id="paneMod">
        <div id="edTop"></div>
        <div id="edBody"><div id="edForm"></div><div id="edPrev"></div></div>
      </div>
    </div>
  </section>
  <aside id="right"><div id="props"></div></aside>
</div>
<dialog id="dlgSet"></dialog>
<script src="js/i18n.js"></script><script src="js/expr.js"></script><script src="js/lib.js"></script><script src="js/model.js"></script>
<script src="js/spec.js"></script><script src="js/view3d.js"></script><script src="js/app.js"></script>
</body>
</html>
