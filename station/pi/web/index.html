<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Станция замеров</title>
<style>
:root{--bg:#14171a;--pn:#1e2328;--ln:#2c333a;--tx:#e8ecef;--mu:#8b96a0;--ac:#3ea6ff;--ok:#4cc38a;--wr:#ffb020;--er:#ff5d5d;--wall:#e8ecef;--pt:#3ea6ff55;--lv:#2fd3c9;--ft:#c08cff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none}
#app{display:grid;grid-template-columns:1fr 360px;height:100vh;height:100dvh}
#view{position:relative;overflow:hidden;touch-action:none}
#view svg,#view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#side{background:var(--pn);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0;overflow:auto}
.sec{padding:10px 12px;border-bottom:1px solid var(--ln)}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,select,input{font:inherit;color:var(--tx);background:#2a3138;border:1px solid var(--ln);border-radius:10px;min-height:46px;padding:0 10px}
button{font-weight:600;cursor:pointer}button:active{filter:brightness(1.3)}
button.pr{background:var(--ac);border-color:var(--ac);color:#04121f}
button.st{background:var(--er);border-color:var(--er);color:#fff}
button.on{outline:2px solid var(--ac)}
button:disabled{opacity:.4}
select,input{flex:1;min-width:0}
.lbl{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
#bar{height:6px;background:#2a3138;border-radius:3px;overflow:hidden;margin-top:8px}#bar i{display:block;height:100%;width:0;background:var(--ac)}
#status{font-weight:600}#status.err{color:var(--er)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td{padding:3px 2px;border-bottom:1px solid var(--ln);vertical-align:top}td:not(:first-child){text-align:right}
#log{font:12px/1.3 ui-monospace,Menlo,monospace;color:var(--mu);max-height:120px;overflow:auto;white-space:pre-wrap}
#jog{display:none}#jog.on{display:block}
.jg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#meas{font-size:18px;font-weight:700;color:var(--ok);font-variant-numeric:tabular-nums;min-height:24px;margin-top:6px}
#tools{position:absolute;left:10px;top:10px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}
#tools button{min-height:40px;background:#1e2328cc}
.ov{position:fixed;inset:0;background:#000d;display:none;flex-direction:column;z-index:9}
.ov.on{display:flex}.ov .row{padding:8px;background:var(--pn)}
.ov div.im{flex:1;overflow:auto;touch-action:pan-x pan-y pinch-zoom}.ov img{display:block;max-width:none;height:100%}
#dlg{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10}
#dlg.on{display:flex}#dlg form{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;width:min(420px,92vw);display:grid;gap:10px}
#dlg label{display:grid;gap:4px;color:var(--mu);font-size:13px}
.ft{color:var(--ft)}.lvc{color:var(--lv)}.mu{color:var(--mu)}
.wl{cursor:pointer}
#alert{display:none;background:var(--er);color:#fff;padding:10px 12px;font-weight:700;gap:8px;align-items:center}#alert.on{display:flex}
#tgt{max-height:230px;overflow:auto;margin-top:6px}#tgt tr{cursor:pointer}#tgt tr.sel td{background:#3ea6ff33}
#lres{margin-top:6px;font-variant-numeric:tabular-nums}#lres b{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}
#cadl{max-height:220px;overflow:auto;margin-top:6px}#cadl td{text-align:left}#cadl input{min-height:0;flex:none;width:18px;height:18px;margin:0}
.tools5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tools5 button{padding:0 4px;font-size:13px}
.lays label{display:inline-flex;gap:4px;align-items:center;margin:2px 8px 2px 0}.lays input{min-height:0;flex:none;width:18px;height:18px;margin:0}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:55vh auto;height:auto}#view{height:55vh}#side{border-left:0;border-top:1px solid var(--ln);overflow:visible}}
</style>
</head>
<body>
<div id="app">
  <div id="view">
    <svg id="svg"><g id="vp"></g></svg>
    <canvas id="cv" style="display:none"></canvas>
    <div id="tools">
      <button id="t2d" class="on" onclick="mode('2d')">План</button><button id="t3d" onclick="mode('3d')">3D</button>
      <button onclick="fit()">⤢</button><button onclick="fs()">⛶</button><button id="tc" onclick="cloudOn=!cloudOn;redraw()">Точки</button>
    </div>
  </div>
  <div id="side">
    <div id="alert"><span id="altx" style="flex:1"></span><button onclick="post({cmd:'alert_ok'}).then(poll)">OK</button></div>
    <div class="sec">
      <div class="lbl">Объект · стоянка</div>
      <div class="row"><select id="proj" onchange="post({cmd:'open',project:this.value}).then(loadRoom)"></select><button onclick="newProj()">+</button></div>
      <div class="row" style="margin-top:8px"><span id="setup" class="mu" style="flex:1"></span><button data-b onclick="newSetup()">Новая стоянка</button></div>
      <div class="row" style="margin-top:8px"><select id="mnt" data-b onchange="post({cmd:'mount',mount:this.value}).then(poll)"><option value="tripod">Штатив</option><option value="floor">Пол (ножки)</option><option value="table">Стол / столешница</option></select><span id="batt" class="mu" style="min-width:92px;text-align:right"></span></div>
    </div>
    <div class="sec">
      <div class="row" style="justify-content:space-between"><span id="status">—</span><span id="pos" class="mu"></span></div>
      <div id="bar"><i></i></div>
    </div>
    <div class="sec grid">
      <button data-b onclick="cmd('calib')">Калибровка</button>
      <button class="pr" data-b onclick="cmd('scan')">Скан</button>
      <button class="st" onclick="post({cmd:'stop'})">Стоп</button>
      <button data-b onclick="dlgLevel()">Уровень…</button>
      <button data-b onclick="dlgSurface()">Неровности…</button>
      <button data-b onclick="cmd('photos')">Фото стен</button>
      <button data-b onclick="refPoint()">Опорная т.</button>
      <button data-b onclick="$('jog').classList.toggle('on')">Наводка</button>
      <button onclick="dl()">Скачать</button>
      <button data-b onclick="dlgWorktop()">Столешница…</button>
    </div>
    <div class="sec" id="jog">
      <div class="row" style="margin-bottom:6px"><span class="mu">Шаг</span><select id="stp"><option>10</option><option selected>1</option><option>0.1</option><option>0.01</option></select><span class="mu">°</span></div>
      <div class="jg">
        <button data-b onclick="mv(-1,0)">◀ Hz</button><button data-b onclick="mv(1,0)">Hz ▶</button>
        <button data-b onclick="mv(0,1)">▲ V</button><button data-b onclick="mv(0,-1)">▼ V</button>
        <button data-b class="pr" onclick="post({cmd:'measure'}).then(poll)">Замер</button><button data-b onclick="post({cmd:'measure',setref:1}).then(poll)">Ур. 0</button>
        <button data-b onclick="mark('hz0')">Начало ⟲</button><button data-b onclick="mark('hz1')">Конец ⟲</button>
        <button data-b onclick="cmd('home')">Нуль Hz</button><button data-b onclick="if(confirm('Текущее положение = 0?'))cmd('zero')">=0</button>
        <button data-b onclick="mvAbs()">Hz/V…</button><button data-b onclick="if(confirm('Полная калибровка с индексом V (8 пар замеров через зенит по потолку)?'))cmd('vindex')">Индекс V</button>
        <button data-b class="pr" onclick="cmd('qpoint')">Точка +</button><button data-b onclick="cmd('floorpt')">Пол ⊥</button>
        <button data-b onclick="if(confirm('Очистить быстрые точки?'))cmd('qclear')">Сброс т.</button><button data-b onclick="cmd('calib')">Нивелир</button>
        <button data-b onclick="cmd('plumb')">Отвес ⊥</button>
      </div>
      <div id="meas"></div><div id="marks" class="mu"></div><div id="quick" style="margin-top:6px"></div>
    </div>
    <div class="sec" id="cad">
      <div class="lbl">Чертёж при замере (как Flexijet)</div>
      <div class="tools5" id="ctools"></div>
      <div class="row" style="margin-top:6px"><label class="mu" style="display:flex;gap:6px;align-items:center;flex:1"><input type="checkbox" id="cmulti" style="min-height:0;flex:none;width:18px;height:18px" onchange="cadTool(S.cad.tool)">много точек (затем «Готово»)</label></div>
      <div class="grid" style="margin-top:6px"><button data-b class="pr" onclick="cmd('cadpt')">Замер ⦿</button><button data-b onclick="cadC({cmd:'cad_done'})">Готово</button><button data-b onclick="cadC({cmd:'cad_undo'})">Отмена</button></div>
      <div id="cstat" class="mu" style="margin-top:6px"></div>
      <div id="cadl"></div>
      <div class="grid" style="margin-top:6px"><button data-b onclick="cadMake('corner')">Пересечение</button><button data-b onclick="cadMake('dist')">Расстояние</button><button data-b onclick="cadMake('angle')">Угол</button>
        <button data-b onclick="cadDel()">Удалить</button><button data-b onclick="if(confirm('Очистить чертёж?'))cadC({cmd:'cad_clear'})">Очистить</button><a id="cdxf" style="display:contents"><button>cad.dxf</button></a></div>
    </div>
    <div class="sec" id="lay">
      <div class="lbl">Вынос проекта (как iCON)</div>
      <div class="row"><button data-b onclick="$('dxf').click()">DXF проекта…</button><span id="lfile" class="mu" style="flex:1;overflow:hidden;text-overflow:ellipsis"></span>
        <input type="file" id="dxf" accept=".dxf" style="display:none" onchange="upDxf(this.files[0])"></div>
      <div id="lpar" style="display:none;margin-top:8px">
        <div class="row"><select id="lmode" onchange="lparUI()"><option value="plan">План (X, Y)</option><option value="wall">Развёртка стены</option></select></div>
        <div class="row" id="lplan" style="margin-top:6px"><select id="lh" onchange="lparUI()"><option value="dxf">Z из DXF</option><option value="floor">на полу</option><option value="ceil">на потолке</option><option value="h">H от пола</option></select><input id="lhv" inputmode="decimal" value="900" style="max-width:90px"></div>
        <div class="row" id="lwall" style="margin-top:6px"><select id="lw" onchange="lparUI()"></select><select id="lc"></select></div>
        <div class="lays mu" id="llay" style="margin-top:6px"></div>
        <button style="margin-top:6px;width:100%" onclick="applyLay()">Применить</button>
      </div>
      <div id="tgt"></div>
      <div class="grid" style="margin-top:8px">
        <button data-b onclick="selStep(-1)">◀</button><button data-b class="pr" onclick="stake()">Навести ⦿</button><button data-b onclick="selStep(1)">▶</button>
        <button data-b onclick="tie()">Привязать</button><button data-b onclick="cmd('resect')">Своб. станция</button><button data-b onclick="if(confirm('Сбросить привязки и свободную станцию?'))cmd('untie')">Сброс привяз.</button>
        <button data-b onclick="dlgLine()">Линия…</button><button data-b onclick="cmd('check')">Проверка ст.</button><button data-b onclick="dlgCmp()">Проект—факт</button>
      </div>
      <div id="lres"></div>
    </div>
    <div class="sec" id="info"><div class="mu">нет данных — «Калибровка», затем «Скан»</div></div>
    <div class="sec"><div id="log"></div></div>
  </div>
</div>
<div id="sheet" class="ov"><div class="row"><b id="shn" style="flex:1"></b><a id="shd" download><button>Скачать PNG</button></a><button onclick="$('sheet').classList.remove('on')">✕</button></div><div class="im"><img id="shi"></div></div>
<div id="dlg"><form onsubmit="return false"><b id="dt"></b><div id="df" style="display:grid;gap:10px"></div><div class="row"><button type="button" onclick="$('dlg').classList.remove('on')" style="flex:1">Отмена</button><button type="button" id="dok" class="pr" style="flex:1">Старт</button></div></form></div>
<script>
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let S={}, R={}, M=null, cloudOn=false, view=null, wasBusy=false, md='2d', cam={yaw:-2.2,pitch:0.75,dist:9000,tx:0,ty:0,tz:1200};
const post=b=>fetch('/api/do',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()).then(j=>{if(j.error)alert(j.error);return j});
const cmd=c=>post({cmd:c}).then(poll);
const mv=(h,v)=>{const s=+$('stp').value;post({cmd:'move',dh:h*s,dv:v*s}).then(poll)};
const mark=w=>post({cmd:'mark',which:w}).then(poll);
const f0=(x,d=0)=>x==null?'—':(+x).toFixed(d);
function mvAbs(){if(!S.pos)return;const t=prompt('Hz V (град)',S.pos.map(x=>x.toFixed(2)).join(' '));if(!t)return;const [h,v]=t.split(/[ ,;]+/).map(Number);post({cmd:'move',dh:h-S.pos[0],dv:v-S.pos[1]}).then(poll)}
function newProj(){const n=prompt('Название объекта (адрес, клиент)');if(n!=null)post({cmd:'new',name:n}).then(()=>{poll();loadRoom()})}
function newSetup(){const n=prompt('Имя новой стоянки (комната, этаж, лестница)','S'+((S.setups||[]).length+1));if(n)post({cmd:'newsetup',name:n}).then(poll)}
function refPoint(){const n=prompt('Номер опорной точки (марки). Луч — в центр марки.','1');if(n)post({cmd:'ref',id:n}).then(poll)}
function dl(){if(S.project)location.href='/zip/'+encodeURIComponent(S.project)}
function fs(){const d=document.documentElement;(document.fullscreenElement?document.exitFullscreen():(d.requestFullscreen||d.webkitRequestFullscreen).call(d))}
function dialog(title,fields,ok){$('dt').textContent=title;$('df').innerHTML=fields.map(f=>`<label>${f[1]}${f[2]=='sel'?`<select id="f_${f[0]}">${f[3].map(o=>`<option>${o}</option>`).join('')}</select>`:f[2]=='txt'?`<input id="f_${f[0]}" value="${f[3]}">`:`<input id="f_${f[0]}" inputmode="decimal" value="${f[2]}">`}</label>`).join('');
  $('dok').onclick=()=>{const v={};fields.forEach(f=>v[f[0]]=$('f_'+f[0]).value);$('dlg').classList.remove('on');ok(v)};$('dlg').classList.add('on')}
function dlgLevel(){const m=S.marks||{};dialog('Трасса по уровню (луч держит высоту)',[['h','Высота от пола в начале координат, мм','900'],['sec','Сектор','sel',['весь круг','от «Начало» до «Конец»']],['step','Шаг, °','0.5']],
  v=>post({cmd:'level',h:+v.h,step:+v.step,hz0:v.sec[0]=='в'?0:(m.hz0||0),hz1:v.sec[0]=='в'?360:(m.hz1||360)}).then(poll))}
function dlgSurface(){const ws=curRoom()?curRoom().walls.filter(w=>w.type=='L'&&!w.conn&&w.len>500).map(w=>w.name):[];if(!ws.length){alert('Сначала «Скан»');return}
  dialog('Карта неровностей',[['wall','Стена','sel',ws],['kind','Поверхность','sel',['стена','пол вдоль стены']],['h0','Стена: от высоты, мм','100'],['h1','Стена: до высоты, мм','2400'],['depth','Пол: глубина от стены, мм','600'],['step','Шаг сетки, мм','100']],
  v=>post({cmd:'surface',wall:v.wall,kind:v.kind[0]=='с'?'wall':'floor',h0:+v.h0,h1:+v.h1,depth:+v.depth,step:+v.step}).then(poll))}
// ---------------- чертёж при замере ----------------
const CT={pt:'Точка',wall:'Стена',edge:'Ребро',plane:'Плоск.',circle:'Окружн.'},CSEL=new Set();
const cadC=b=>post(b).then(poll);
function cadTool(t){cadC({cmd:'cad_tool',tool:t,multi:$('cmulti').checked})}
function cadMake(op){const ids=[...CSEL];if(ids.length<2){alert(op=='corner'?'Отметьте 2 стены (+ плоскость пола/потолка для высоты угла)':'Отметьте 2 элемента');return}cadC({cmd:'cad_make',op,ids}).then(()=>CSEL.clear())}
function cadDel(){const ids=[...CSEL];if(!ids.length){alert('Отметьте элементы');return}cadC({cmd:'cad_del',ids}).then(()=>CSEL.clear())}
function cadPanel(){const C=S.cad;if(!C){$('cad').style.display='none';return}$('cad').style.display='';
  $('ctools').innerHTML=Object.entries(CT).map(([k,n])=>`<button data-b class="${C.tool==k?'on':''}" onclick="cadTool('${k}')">${n}</button>`).join('');
  if(document.activeElement!==$('cmulti'))$('cmulti').checked=!!C.multi;
  $('cstat').textContent=`${CT[C.tool]}: ${C.pending?`точек ${C.pending}${C.multi?'':' из '+C.need}`:'наведите и «Замер»'}${C.multi?' · «Готово» — закончить':''}`;
  $('cadl').innerHTML=C.els.length?'<table>'+C.els.slice().reverse().map(e=>`<tr><td style="width:24px"><input type="checkbox" data-id="${e.id}" ${CSEL.has(e.id)?'checked':''}></td><td><b>${e.id}</b> <span class="${e.ok?'':'er'}">${e.label}</span></td></tr>`).join('')+'</table>':'<div class="mu">Стена — 2 точки на стене (на любой высоте), угол комнаты — «Пересечение» двух стен, даже если угол закрыт мебелью.</div>';
  $('cadl').querySelectorAll('input').forEach(i=>i.onchange=()=>{const id=+i.dataset.id;i.checked?CSEL.add(id):CSEL.delete(id)});
  if(S.project)$('cdxf').href='/f/'+encodeURIComponent(S.project)+'/cad.dxf?dl=1';
  const sig=JSON.stringify(C.plan)+JSON.stringify(C.pend)+JSON.stringify(S.wt&&S.wt.poly);if(sig!==cadPanel.sig){cadPanel.sig=sig;if(md=='2d'&&M)draw()}}
// ---------------- столешница ----------------
function dlgWorktop(){const m=S.marks||{};dialog('Шаблон столешницы: лазер обходит стены на высоте столешницы',[['h','Высота (Z проекта: низ столешницы = верх шкафов), мм','900'],['sec','Сектор (стены под столешницей)','sel',['от «Начало» до «Конец»','весь круг']],
  ['d','Глубина (шкаф + свес), мм','620'],['mode','Задняя кромка','sel',['по выступу стены (камень)','по средней линии']],['cut','Вырезы: имя, центр от начала, ширина, глубина, от фасада; через «;»','txt','мойка 1200 780 480 70'],['e0','Удлинить начало, мм','0'],['e1','Удлинить конец, мм','0']],
  v=>post({cmd:'worktop',h:+v.h,depth:+v.d,hz0:v.sec[0]=='о'?(m.hz0||0):0,hz1:v.sec[0]=='о'?(m.hz1||360):360,mode:v.mode[0]=='п'&&v.mode[3]=='в'?'touch':'fit',cut:v.cut,e0:+v.e0,e1:+v.e1}).then(poll))}
// ---------------- вынос проекта ----------------
let LP=null;
async function upDxf(f){if(!f)return;const j=await (await fetch('/api/upload?name='+encodeURIComponent(f.name),{method:'POST',body:f})).json();if(j.error){alert(j.error);return}
  LP={_local:1,file:j.file,layers_all:j.layers,layers:j.layers.filter(l=>l.pts||l.lines).map(l=>l.name),mode:'plan',hmode:'dxf',h:900};showLay(true);await poll()}
function showLay(force){const L=(S.lay||{}).p||{};if(!LP||force===false)LP=Object.assign({},L);if(!LP.file){$('lpar').style.display='none';$('lfile').textContent='';return}
  $('lfile').textContent=LP.file;$('lpar').style.display='';$('lmode').value=LP.mode||'plan';$('lh').value=LP.hmode||'dxf';$('lhv').value=LP.h??900;
  const r=curRoom(),ws=r?r.walls.filter(w=>w.type=='L'&&!w.conn&&w.len>300):[];$('lw').innerHTML=ws.map(w=>`<option>${w.name}</option>`).join('');if(LP.wall)$('lw').value=LP.wall;
  $('llay').innerHTML='Слои: '+(LP.layers_all||[]).map(l=>`<label><input type="checkbox" value="${l.name}" ${(LP.layers||[]).includes(l.name)?'checked':''}>${l.name} <span>${l.pts?l.pts+' т.':''}${l.lines?' '+l.lines+' л.':''}</span></label>`).join('');lparUI()}
function lparUI(){const w=$('lmode').value=='wall';$('lplan').style.display=w?'none':'';$('lwall').style.display=w?'':'none';$('lhv').style.display=$('lh').value=='h'?'':'none';
  const n=$('lw').value||'';const c=n.split('-');$('lc').innerHTML=c.length==2?`<option value="1">от угла ${c[1]} (левый)</option><option value="0">от угла ${c[0]}</option>`:'';if(LP&&LP.corner!=null&&LP.wall==n)$('lc').value=LP.corner}
function applyLay(){const p={cmd:'layout',file:LP.file,mode:$('lmode').value,hmode:$('lh').value,h:+$('lhv').value,wall:$('lw').value,corner:+($('lc').value||0),room:curRoom()?curRoom().name:null,
  layers:[...document.querySelectorAll('#llay input:checked')].map(i=>i.value)};post(p).then(j=>{if(!j.error){LP=null;LPs=null;poll().then(redraw)}})}
function selStep(k){const T=(S.lay||{}).targets||[];if(!T.length)return;let i=T.findIndex(t=>t.id==S.lay.sel);i=Math.max(0,Math.min(T.length-1,i+k));post({cmd:'sel',id:T[i].id}).then(poll)}
function stake(){if(!(S.lay||{}).sel){alert('Загрузите DXF и выберите точку');return}post({cmd:'stake',id:S.lay.sel}).then(poll)}

// ---------------- быстрый замер (точка-точка) ----------------
function quickList(Q){if(!Q.length){$('quick').innerHTML='<span class="mu">Быстрый замер: навести → «Точка +». Расстояние, ΔH, уклон, площадь.</span>';return}
  const d=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),dh=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
  let h='<table><tr class="mu"><td>№</td><td>L</td><td>L гор.</td><td>ΔH</td><td>уклон</td></tr>';
  Q.forEach((p,i)=>{if(!i){h+=`<tr><td>P1</td><td colspan="4" class="mu">Z ${p[2].toFixed(1)}</td></tr>`;return}const a=Q[i-1],z=p[2]-a[2],g=dh(a,p);
    h+=`<tr><td>P${i}→${i+1}</td><td><b>${d(a,p).toFixed(1)}</b></td><td>${g.toFixed(1)}</td><td>${z>=0?'+':''}${z.toFixed(1)}</td><td>${(Math.atan2(z,g)*180/Math.PI).toFixed(2)}°</td></tr>`});
  if(Q.length>2){let A=0,P=0;for(let i=0;i<Q.length;i++){const a=Q[i],b=Q[(i+1)%Q.length];A+=a[0]*b[1]-b[0]*a[1];P+=dh(a,b)}
    const a=Q[Q.length-2],b=Q[Q.length-1],c=Q[0];h+=`<tr><td colspan="5" class="mu">P1→P${Q.length}: ${d(Q[0],b).toFixed(1)} · площадь (гор.) ${(Math.abs(A)/2e6).toFixed(3)} м² · периметр ${(P/1000).toFixed(3)} м</td></tr>`}
  $('quick').innerHTML=h+'</table>'}
// ---------------- таблицы ----------------
function table(){
  if(!M||!M.rooms){$('info').innerHTML='<div class="mu">нет данных — «Калибровка», затем «Скан»</div>';return}
  let h='';
  M.rooms.forEach(r=>{
    h+=`<div class="lbl">${r.name} · пол ${f0(r.floor_mm_m,1)} мм/м · потолок ${f0(r.ceil_mm_m,1)} мм/м</div>`;
    if(r.features.length)h+='<table>'+r.features.map(f=>`<tr><td class="ft">${f.kind}</td><td>${f.width.toFixed(0)}×${f.full?'H':(f.z1-f.z0).toFixed(0)}, гл.${f.depth.toFixed(0)}${f.r?`, R${f.r.toFixed(0)} ⌒${f.arclen.toFixed(0)}`:''}${f.full?'':`<br><span class="mu">низ Z${f.z0.toFixed(0)} верх Z${f.z1.toFixed(0)}</span>`}</td></tr>`).join('')+'</table>';
    h+='<table style="margin-top:6px"><tr class="mu"><td>Угол</td><td>°</td><td>H</td><td>пол Z</td></tr>'+r.corners.map(c=>`<tr><td>${c.name}</td><td>${c.angle.toFixed(2)}</td><td>${c.h.toFixed(0)}</td><td>${c.floor>=0?'+':''}${c.floor.toFixed(1)}</td></tr>`).join('')+'</table>';
    h+='<table style="margin:6px 0 10px"><tr class="mu"><td>Стена</td><td>мм</td><td></td></tr>'+r.walls.map(w=>`<tr><td>${w.name}</td><td>${w.type=='A'?`R${w.r.toFixed(0)} ⌒`:''}${w.len.toFixed(0)}</td><td>${w.sheet?`<a href="#" onclick='showWall(${JSON.stringify(w)});return false' style="color:var(--ac)">фото</a>`:''}</td></tr>`).join('')+'</table>';
  });
  if((M.levels||[]).length){h+='<div class="lbl">Трассы по уровню</div><table>'+M.levels.map(l=>`<tr><td class="lvc">Z ${l.h.toFixed(0)}</td><td>${l.parts.filter(p=>p.len>30).map(p=>p.type=='A'?`<b>R${p.r.toFixed(0)} ⌒${p.len.toFixed(0)} хорда ${p.chord.toFixed(0)}</b>`:p.len.toFixed(0)).join(' · ')}<br><span class="mu">${l.features.map(f=>f.kind+' '+f.width.toFixed(0)+' гл.'+f.depth.toFixed(0)).join('; ')}</span></td></tr>`).join('')+'</table>'}
  const W=S.wt;if(W){h+=`<div class="lbl" style="margin-top:8px">Столешница · ${W.name}</div><table><tr><td>задняя кромка</td><td>${W.back.map(x=>x.toFixed(0)).join(' + ')}</td></tr><tr><td>фасад (глуб. ${W.depth.toFixed(0)})</td><td>${W.front.map(x=>x.toFixed(0)).join(' + ')}</td></tr>`+
    (W.angles.length?`<tr><td>углы стен</td><td>${W.angles.map(a=>a.toFixed(2)+'°').join(' · ')}</td></tr>`:'')+W.walls.map((w,i)=>`<tr><td>стена ${i+1}</td><td>выступ ${w.pro.toFixed(1)} · зазор до ${w.gap.toFixed(1)} мм</td></tr>`).join('')+`<tr><td>площадь</td><td>${W.area_m2.toFixed(2)} м²</td></tr></table>`}
  if((M.surfaces||[]).length){h+='<div class="lbl" style="margin-top:8px">Неровности</div><table>'+M.surfaces.map(s=>`<tr><td><a href="#" onclick="showImg('${s.png}','${s.name}');return false" style="color:var(--ac)">${s.name}</a></td><td>${s.kind=='wall'?`зазор ≤${s.gap_max.toFixed(1)} · плоск. ${s.flatness.toFixed(1)} · верт. ${s.plumb_mm_m>=0?'+':''}${s.plumb_mm_m.toFixed(1)} мм/м`:`ножки 0…${s.level_range.toFixed(1)} · уклон ${s.slope_mm_m.toFixed(1)} мм/м`}</td></tr>`).join('')+'</table>'}
  if((M.setups||[]).length>1||(M.refs||[]).length){h+='<div class="lbl" style="margin-top:8px">Стоянки (привязка по маркам)</div><table>'+M.setups.map(s=>`<tr><td>${s.name}</td><td>${!s.reg?'<span style="color:var(--er)">не привязана</span>':s.reg.n?`${s.reg.n} марки · СКО ${s.reg.rms.toFixed(1)} · max ${s.reg.max.toFixed(1)} мм`:'база'}</td></tr>`).join('')+'</table>'}
  h+=`<div class="mu" style="margin-top:8px">Файлы: ${R.files.filter(f=>/\.(dxf|obj|stl)$/.test(f)).map(f=>`<a style="color:var(--ac)" href="/f/${encodeURIComponent(R.project)}/${f}?dl=1">${f}</a>`).join(' · ')}</div>`;
  $('info').innerHTML=h;
}
function showImg(f,n){const u='/f/'+encodeURIComponent(R.project)+'/'+f;$('shn').textContent=n;$('shi').src=u+'?t='+Date.now();$('shd').href=u+'?dl=1';$('sheet').classList.add('on')}
function showWall(w){if(!w.sheet){alert(`Стена ${w.name}: ${w.len.toFixed(0)} мм. Развёртки нет — «Фото стен»`);return}showImg(w.sheet,'Стена '+w.name+' · '+w.len.toFixed(0)+' мм')}
// ---------------- жесты ----------------
(()=>{const P=new Map();let st=null;
 const on=(el,fn2,fn3)=>{
  el.addEventListener('pointerdown',e=>{if(!e.target.classList.contains('wl'))el.setPointerCapture(e.pointerId);P.set(e.pointerId,[e.offsetX,e.offsetY]);st=null});
  el.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);P.set(e.pointerId,[e.offsetX,e.offsetY]);
    if(P.size==1)fn2(e.offsetX-o[0],e.offsetY-o[1]);else if(P.size==2){const [a,b]=[...P.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),m=[(a[0]+b[0])/2,(a[1]+b[1])/2];if(st)fn3(d/st.d,m);st={d,m}}});
  const up=e=>{P.delete(e.pointerId);st=null};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',e=>{e.preventDefault();fn3(Math.exp(-e.deltaY/400),[e.offsetX,e.offsetY])},{passive:false})};
 on($('svg'),(dx,dy)=>{if(!view)return;view.x+=dx;view.y+=dy;draw()},(f,m)=>{if(!view)return;view.x=m[0]-(m[0]-view.x)*f;view.y=m[1]-(m[1]-view.y)*f;view.k*=f;draw()});
 on($('cv'),(dx,dy)=>{cam.yaw-=dx*0.008;cam.pitch=Math.max(-0.2,Math.min(1.5,cam.pitch+dy*0.008));render()},(f)=>{cam.dist/=f;render()});
 addEventListener('resize',()=>{view=null;redraw()});})();
poll().then(loadRoom);setInterval(poll,1000);
</script>
