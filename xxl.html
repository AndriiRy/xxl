<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#1e2630;color:#e8edf2;overflow:hidden}

button{background:#2f3b48;border:1px solid #435263;border-radius:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}

input,textarea{-webkit-user-select:text;user-select:text}
input,select,textarea{font-size:16px;background:#11171d;border:1px solid #435263;border-radius:6px;padding:6px}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#top{display:flex;gap:6px;padding:6px;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right));overflow-x:auto;scrollbar-width:none;align-items:center;background:#161d24;border-bottom:1px solid #2c3743}

#view{position:relative;flex:1;min-width:0;min-height:0;touch-action:none;background:#0d1217}
#cv{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;left:6px;bottom:6px;font-size:12px;background:#000a;padding:3px 7px;border-radius:6px;pointer-events:none}

 #main{flex-direction:column}

}

.c-MSG{color:#ff7b72;font-weight:bold}.c-PAR,.c-L{color:#d2a8ff}.c-com{color:#8b949e}.c-XN{color:#79c0ff}

<div id="app">
 <div id="top">

 </div>

<script>
'use strict';
// ====== ИНСТРУМЕНТЫ (DEF.TLG z Google Drive: Xilog Plus\Job, 07.10.2026; cnc/tlg_to_txt.py) ======
const TOOLS_VER='2026-10-07';
const TOOLS_DEFAULT={"82":3.4,"83":3.4,"91":16.0,"93":10.0,"101":12.0,"102":11.35,"103":17.0,"104":16.0,"105":80.0,"106":16.0,"107":34.0,"108":42.0,"109":23.6,"110":52.0,"111":9.27,"112":12.0,"113":36.0,"114":8.0,"115":6.0,"116":30.0,"117":12.0,"118":6.0,"119":4.0,"120":6.0,"121":12.0,"122":60.0,"123":52.0,"124":66.0,"125":180.0,"126":51.7,"127":6.0,"128":50.8,"129":15.4,"130":52.0,"131":22.0,"132":8.0,"133":54.0,"134":28.3,"135":80.0,"136":78.2,"137":17.4,"138":28.3,"139":6.0,"140":80.0,"182":3.3};
const TOOL_NAMES={"101":"FREZ MALY WSTAWKI","102":"FREZ FI12","103":"FREZ FI 19.55","104":"FREZ ZENITA","105":"80x14 Frezowanie","106":"FREZ 16","107":"frez maly raczka kopia","109":"GRUBASY  h=70mm","110":"frez skosny 45*","111":"FI=10","112":"HPL Dimar","113":"FREZ DO FRONTU 1","114":"P2B-R4.0","115":"SPIRAL","116":"FREZ DO FRONTU 4","117":"FREZ Z WYMIENNYMI NOZAMI","118":"6X21mm","119":"4x10","120":"6X21mm","121":"FREZ Z WYMIENNYMI NOZAMI","122":"60","123":"frez skosny 45*","124":"91 stopni","125":"PIŁKA 180","126":"stara barsa","127":"SPIRAL","128":"KULA DUZA","129":"FREZ DO FUTRYN","130":"frez skosny 45*","131":"Dimar krztaltowy","132":"P2B-R4.0","133":"Dimar 130","134":"frez profil","135":"80x14 Frezowanie","136":"80 frezowanie","137":"FREZ FI=17.4","138":"profil 28.3","139":"CMT 6x12.7","140":"SZTOTKA 75mm"};
const FIELD_DEFAULT={x:3050,y:1248};
let SET=Object.assign({tools:TOOLS_DEFAULT,f2right:true,flipY:false,field:FIELD_DEFAULT,lang:'ru'},JSON.parse(localStorage.getItem('xxl_set')||'{}'));
if(SET.toolsVer!==TOOLS_VER){SET.tools=TOOLS_DEFAULT;SET.toolsVer=TOOLS_VER;try{localStorage.setItem('xxl_set',JSON.stringify(SET))}catch(e){}}
function saveSet(){localStorage.setItem('xxl_set',JSON.stringify(SET))}

// ====== СОСТОЯНИЕ ======
let doc={name:'',path:null,lines:[],crlf:true,cp1250:false};
let hl=new Set();
let model=null, sel=-1, undo=[], tab='code', mode='', meas=[], stepMax=0, step=Infinity, sideF='all';
let view={s:1,ox:0,oy:0}, W=0,H=0, dpr=1;
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
let SERVER=false;

// ====== РАЗБОР СТРОКИ ======
function splitComment(s){let q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c=='"')q=!q;else if(c==';'&&!q)return [s.slice(0,i),s.slice(i+1)]}return [s,null]}
function tokenize(s){const t=[];let cur='',q=false;for(const c of s){if(c=='"'){q=!q;cur+=c}else if(/\s/.test(c)&&!q){if(cur)t.push(cur);cur=''}else cur+=c}if(cur)t.push(cur);
 const out=[];for(const k of t){if(k.startsWith('=')&&out.length&&!out[out.length-1].includes('='))out[out.length-1]+=k;else if(k=='='&&out.length){out[out.length-1]+='='}else if(out.length&&out[out.length-1].endsWith('=')&&!k.includes('='))out[out.length-1]+=k;else out.push(k)}return out}
function parseLine(raw){
 const tr=raw.trim();
 if(!tr)return {raw,cmd:'',params:[],comment:null};
 if(tr.startsWith(';'))return {raw,cmd:';',params:[],comment:tr.slice(1)};
 const [code,com]=splitComment(raw);const tk=tokenize(code.trim());
 const cmd=(tk.shift()||'').toUpperCase();
 const params=tk.map(t=>{const i=t.indexOf('=');if(i>0&&!t.startsWith('"'))return {k:t.slice(0,i),v:t.slice(i+1)};return {flag:t}});
 return {raw,cmd,params,comment:com};
}
function buildLine(L){
 if(L.cmd==';')return ';'+(L.comment||'');
 if(!L.cmd)return '';
 let s=L.cmd+' '+L.params.map(p=>p.flag!==undefined?p.flag:(L.cmd=='PAR'&&p===L.params[0]?p.k+' ='+p.v:p.k+'='+p.v)).join(' ');
 if(L.comment!=null)s+=' ;'+L.comment;return s;
}
function P(L,k){const p=L.params.find(p=>p.k===k);return p?p.v:undefined}
function setP(L,k,v){let p=L.params.find(p=>p.k===k);if(v===''||v==null){L.params=L.params.filter(q=>q.k!==k);return}if(p)p.v=v;else L.params.push({k,v})}

// ====== ВЫРАЖЕНИЯ (DX/2, DY-32, (DX-C3)/2+C3, sqrt…) ======
const FN={SQRT:Math.sqrt,SIN:x=>Math.sin(x*Math.PI/180),COS:x=>Math.cos(x*Math.PI/180),TAN:x=>Math.tan(x*Math.PI/180),ATAN:x=>Math.atan(x)*180/Math.PI,ABS:Math.abs,INT:Math.trunc,ROUND:Math.round,SQR:x=>x*x};
function evalExpr(src,vars){
 src=String(src).replace(/#$/,'').trim();let i=0;
 const err=m=>{throw new Error(m+' в «'+src+'»')};
 const ws=()=>{while(src[i]==' ')i++};
 function prim(){ws();const c=src[i];
  if(c=='('){i++;const v=add();ws();if(src[i]!=')')err('нет )');i++;return v}
  if(c=='-'){i++;return -prim()} if(c=='+'){i++;return prim()}
  let m=/^(\d+\.?\d*|\.\d+)(e[+-]?\d+)?/i.exec(src.slice(i));if(m){i+=m[0].length;return parseFloat(m[0])}
  m=/^[A-Za-z_][A-Za-z_0-9]*/.exec(src.slice(i));
  if(m){i+=m[0].length;const n=m[0];ws();
   if(src[i]=='('&&FN[n.toUpperCase()]){i++;const v=add();ws();i++;return FN[n.toUpperCase()](v)}
   if(n in vars)return vars[n];const u=n.toUpperCase();for(const k in vars)if(k.toUpperCase()==u)return vars[k];
   if(u=='PI')return Math.PI;err('неизвестная переменная '+n)}
  err('ошибка')}
 function pow(){let v=prim();ws();while(src[i]=='^'){i++;v=Math.pow(v,prim())}return v}
 function mul(){let v=pow();for(;;){ws();const c=src[i];if(c=='*'){i++;v*=pow()}else if(c=='/'){i++;v/=pow()}else return v}}
 function add(){let v=mul();for(;;){ws();const c=src[i];if(c=='+'){i++;v+=mul()}else if(c=='-'){i++;v-=mul()}else return v}}
 const v=add();ws();if(i<src.length)err('лишнее');return v;
}

// ====== ПОСТРОЕНИЕ МОДЕЛИ ======
function toolD(t){return SET.tools[t]||SET.tools[String(t)]||0}
function build(){
 const vars={DX:0,DY:0,DZ:18};const els=[];const issues=[];let side=0,sides=1;let pen=null,cur={x:0,y:0,z:0},lastF=1;
 const m={dx:0,dy:0,dz:18,vars,els,issues,pars:[],lvars:[],hasXN:false,origin:'',ops:0};
 const ev=(L,k,def,li)=>{const v=P(L,k);if(v===undefined)return def;try{return evalExpr(v,vars)}catch(e){issues.push({li,lvl:'e',t:e.message});return def}};
 const endPen=()=>{if(pen&&pen.segs.length)els.push(pen);pen=null};
 doc.lines.forEach((L,li)=>{
  const c=L.cmd;
  if(c=='H'){m.dx=vars.DX=ev(L,'DX',0,li);m.dy=vars.DY=ev(L,'DY',0,li);m.dz=vars.DZ=ev(L,'DZ',18,li);m.origin=(L.params.find(p=>p.flag&&/^-/.test(p.flag))||{}).flag||'';return}
  if(c=='PAR'){const p=L.params.find(p=>p.k);if(p){try{vars[p.k]=evalExpr(p.v,vars)}catch(e){issues.push({li,lvl:'e',t:e.message})}m.pars.push({li,k:p.k,v:p.v,desc:(L.params.find(q=>q.flag)||{}).flag})}return}
  if(c=='L'){const p=L.params.find(p=>p.k);if(p){try{vars[p.k]=evalExpr(p.v,vars);m.lvars.push({li,k:p.k,v:p.v,val:vars[p.k]})}catch(e){issues.push({li,lvl:'e',t:e.message})}}return}
  if(c=='MSG'||c=='XMSG'){endPen();if(/SBY\s*=/.test(L.raw)){side++;sides=side+1}return}
  if(c=='XBO'||c=='BOANGO'){
   endPen();m.ops++;
   const F=Math.round(ev(L,'F',lastF,li));if(P(L,'F')!==undefined)lastF=F;
   const X=ev(L,'X',0,li),Y=ev(L,'Y',0,li),Z=ev(L,'Z',0,li),D=ev(L,'D',0,li);
   let R=P(L,'R');const hasR=R!==undefined;R=hasR?Math.max(1,Math.round(ev(L,'R',1,li))):1;
   const sx=ev(L,'x',0,li),sy=ev(L,'y',0,li);const N=(P(L,'N')||'"P"').replace(/"/g,'');
   if(!hasR)issues.push({li,lvl:'w',t:'нет R=1 — Xilog повторит прошлый R'});
   for(let r=0;r<R;r++){els.push({type:'hole',li,side,F,x:X+r*sx,y:Y+r*sy,z:Z,d:D,n:N,ang:c=='BOANGO'?ev(L,'J',0,li):null})}
   return}
  if(c=='XG0'){endPen();m.ops++;
   const T=Math.round(ev(L,'T',0,li));const F=Math.round(ev(L,'F',lastF,li));if(P(L,'F')===undefined)issues.push({li,lvl:'w',t:'XG0 без F=1'});else lastF=F;
   cur={x:ev(L,'X',0,li),y:ev(L,'Y',0,li),z:ev(L,'Z',0,li)};
   const C=Math.round(ev(L,'C',0,li));const d=toolD(T);if(!d)issues.push({li,lvl:'w',t:'инструмент T'+T+' не в таблице (⚙)'});
   pen={type:'path',li,side,F,T,C,d,start:{...cur},segs:[]};return}
  if(c=='XL2P'||c=='XAR2'||c=='XAR'||c=='XA2P'){
   if(!pen){issues.push({li,lvl:'e',t:c+' без XG0'});return}
   const p0={...cur};const p1={x:ev(L,'X',cur.x,li),y:ev(L,'Y',cur.y,li),z:ev(L,'Z',cur.z,li)};
   let pts;
   if(c=='XL2P')pts=[p0,p1];
   else if(c=='XA2P'){const cx=ev(L,'I',0,li),cy=ev(L,'J',0,li),G=Math.round(ev(L,'G',2,li));pts=arcPts(p0,p1,{x:cx,y:cy},G==2)}
   else{const r=ev(L,'r',0,li),G=Math.round(ev(L,'G',2,li));const cen=arcCenter(p0,p1,r,G,c);if(!cen){issues.push({li,lvl:'e',t:'радиус дуги меньше половины хорды'});pts=[p0,p1]}else pts=arcPts(p0,p1,cen,G==2)}
   pen.segs.push({li,pts,z:p1.z});cur=p1;return}
  if(c=='XGOUT'||c=='XGOUTK'){endPen();return}
  if(c=='XN'){endPen();m.hasXN=true;return}
 });
 endPen();
 m.sides=sides;
 // проверки
 if(!m.dx||!m.dy)issues.push({li:0,lvl:'e',t:'нет строки H DX= DY= DZ='});
 if(m.dx>SET.field.x||m.dy>SET.field.y)issues.push({li:0,lvl:'w',t:`деталь ${m.dx}×${m.dy} больше поля ${SET.field.x}×${SET.field.y}`});
 if(!m.hasXN)issues.push({li:doc.lines.length-1,lvl:'w',t:'нет XN в конце (отъезд)'});
 for(const e of els){
  if(e.type=='hole'){
   if(e.F==1){if(e.x<-0.01||e.y<-0.01||e.x>m.dx+0.01||e.y>m.dy+0.01)issues.push({li:e.li,lvl:'e',t:`отверстие вне детали (${f1(e.x)}; ${f1(e.y)})`});
    if(e.n=='P'&&e.z>=m.dz)issues.push({li:e.li,lvl:'w',t:`глубина ${f1(e.z)} ≥ толщины, а N="P" (не сквозное)`});
    if(e.x-e.d/2<0||e.y-e.d/2<0||e.x+e.d/2>m.dx||e.y+e.d/2>m.dy)if(!(e.x<0||e.y<0||e.x>m.dx||e.y>m.dy))issues.push({li:e.li,lvl:'w',t:'отверстие задевает край'});}
   else{const t=(e.F==2||e.F==3)?e.x:e.y;if(t<0||t>m.dz)issues.push({li:e.li,lvl:'e',t:`отверстие в торце вне толщины (${f1(t)})`})}
  }
  if(e.type=='path'){for(const s of e.segs)if(s.z>m.dz+0.5)issues.push({li:s.li,lvl:'w',t:`фреза глубже толщины: Z=${f1(s.z)}`})}
 }
 const seen=new Set();m.issues=issues.filter(i=>{const k=i.li+i.t;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.li-b.li);
 return m;
}
function arcCenter(p0,p1,r,G,cmd){
 const dx=p1.x-p0.x,dy=p1.y-p0.y,L=Math.hypot(dx,dy);const R=Math.abs(r);if(L/2>R+1e-6||L<1e-9)return null;
 const h=Math.sqrt(Math.max(0,R*R-L*L/4));const mx=(p0.x+p1.x)/2,my=(p0.y+p1.y)/2;const nx=-dy/L,ny=dx/L;// влево от хорды
 let left;
 if(cmd=='XAR')left=r>0;               // XAR: r>0 — центр слева от хорды
 else{const ccw=G==3;left=ccw;if(r<0)left=!left}  // XAR2: r>0 — короткая дуга
 return left?{x:mx+nx*h,y:my+ny*h}:{x:mx-nx*h,y:my-ny*h};
}
function arcPts(p0,p1,c,cw){
 const R=Math.hypot(p0.x-c.x,p0.y-c.y);let a0=Math.atan2(p0.y-c.y,p0.x-c.x),a1=Math.atan2(p1.y-c.y,p1.x-c.x);
 let da=a1-a0;if(cw){while(da>=0)da-=2*Math.PI}else{while(da<=0)da+=2*Math.PI}
 if(Math.hypot(p1.x-p0.x,p1.y-p0.y)<1e-6)da=cw?-2*Math.PI:2*Math.PI;
 const n=Math.max(8,Math.ceil(Math.abs(da)*R/2));const pts=[];
 for(let i=0;i<=n;i++){const a=a0+da*i/n;pts.push({x:c.x+R*Math.cos(a),y:c.y+R*Math.sin(a),z:p0.z+(p1.z-p0.z)*i/n})}return pts;
}
// смещение траектории на радиус (C=1 справа, C=2 слева по ходу)
function offsetPath(pts,r,C){
 if(!C||C>2||!r)return pts;const sgn=C==1?-1:1;const out=[];
 const segN=[];for(let i=0;i<pts.length-1;i++){const dx=pts[i+1].x-pts[i].x,dy=pts[i+1].y-pts[i].y,L=Math.hypot(dx,dy);segN.push(L<1e-9?null:{x:-dy/L*sgn,y:dx/L*sgn})}
 let prev=null;
 for(let i=0;i<pts.length-1;i++){const n=segN[i];if(!n)continue;const a=pts[i],b=pts[i+1];
  if(prev){const a0=Math.atan2(prev.y,prev.x),a1=Math.atan2(n.y,n.x);let d=a1-a0;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
   if(d*sgn<0){}else{const k=Math.ceil(Math.abs(d)/0.2);for(let j=1;j<k;j++){const t=a0+d*j/k;out.push({x:a.x+r*Math.cos(t),y:a.y+r*Math.sin(t)})}}}
  out.push({x:a.x+n.x*r,y:a.y+n.y*r});out.push({x:b.x+n.x*r,y:b.y+n.y*r});prev=n}

}
const f1=v=>(Math.round(v*100)/100).toString();

// ====== ГРАНИ → КООРДИНАТЫ ЧЕРТЕЖА ======
function gap(){return Math.max(25,model.dz*1.5)}
function faceMap(F,a,b){const g=gap(),dx=model.dx,dy=model.dy;
 if(F==4)return {x:a,y:-g-b};                 // перед (Y=0)
 if(F==5)return {x:a,y:dy+g+b};               // зад (Y=DY)
 const right=(F==2)==SET.f2right;
 if(F==2||F==3)return right?{x:dx+g+a,y:b}:{x:-g-a,y:b};
 return {x:a,y:b}}
function holeDepthLine(e){const dx=model.dx,dy=model.dy;
 if(e.F==4)return [{x:e.x,y:0},{x:e.x,y:e.z}];
 if(e.F==5)return [{x:e.x,y:dy},{x:e.x,y:dy-e.z}];
 const right=(e.F==2)==SET.f2right;
 if(e.F==2||e.F==3)return right?[{x:dx,y:e.y},{x:dx-e.z,y:e.y}]:[{x:0,y:e.y},{x:e.z,y:e.y}];
 return null}

// ====== РИСОВАНИЕ ======
const W2S=p=>({x:view.ox+p.x*view.s,y:view.oy+(SET.flipY?1:-1)*p.y*view.s});
const S2W=(x,y)=>({x:(x-view.ox)/view.s,y:(y-view.oy)/((SET.flipY?1:-1)*view.s)});
function visible(e){return (sideF=='all'||String(e.side)==sideF)&&e.li<=step}
function fit(){if(!model)return;const g=gap()+model.dz+10;let x0=-g,y0=-g,x1=model.dx+g,y1=model.dy+g;
 for(const e of model.els)if(e.type=='path')for(const s of e.segs)for(const p of s.pts){x0=Math.min(x0,p.x-e.d);x1=Math.max(x1,p.x+e.d);y0=Math.min(y0,p.y-e.d);y1=Math.max(y1,p.y+e.d)}
 const s=Math.min(W/(x1-x0),H/(y1-y0))*0.92;view.s=s;view.ox=W/2-(x0+x1)/2*s;view.oy=H/2+(SET.flipY?-1:1)*(y0+y1)/2*s;draw()}
function resize(){const r=$('view').getBoundingClientRect();dpr=window.devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;draw()}
function holeColor(e){if(e.n=='L'||e.z>=model.dz)return '#ff5d5d';return {5:'#59d38c',8:'#58a6ff',7:'#ff9f5d',35:'#e3b341',4.8:'#d2a8ff',25:'#ffd866'}[e.d]||'#7fd6e8'}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 if(!model){ctx.fillStyle='#8b949e';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('Откройте файл .xxl  📂',W/2,H/2);return}
 const s=view.s,dx=model.dx,dy=model.dy,dz=model.dz,g=gap();
 // сетка
 const stepG=[10,50,100,500].find(v=>v*s>40)||1000;ctx.strokeStyle='#1a232c';ctx.lineWidth=1;ctx.beginPath();
 const a=S2W(0,0),b=S2W(W,H);for(let x=Math.floor(Math.min(a.x,b.x)/stepG)*stepG;x<Math.max(a.x,b.x);x+=stepG){const p=W2S({x,y:0});ctx.moveTo(p.x,0);ctx.lineTo(p.x,H)}
 for(let y=Math.floor(Math.min(a.y,b.y)/stepG)*stepG;y<Math.max(a.y,b.y);y+=stepG){const p=W2S({x:0,y});ctx.moveTo(0,p.y);ctx.lineTo(W,p.y)}ctx.stroke();
 // деталь и торцы
 const rect=(x,y,w,h,fill,stroke)=>{const p=W2S({x,y}),q=W2S({x:x+w,y:y+h});ctx.fillStyle=fill;ctx.strokeStyle=stroke;ctx.lineWidth=1.5;const rx=Math.min(p.x,q.x),ry=Math.min(p.y,q.y);ctx.fillRect(rx,ry,Math.abs(q.x-p.x),Math.abs(q.y-p.y));ctx.strokeRect(rx,ry,Math.abs(q.x-p.x),Math.abs(q.y-p.y))};
 rect(0,0,dx,dy,'#d9c7a6','#f0e6d2');
 rect(0,-g-dz,dx,dz,'#b9a684','#665');rect(0,dy+g,dx,dz,'#b9a684','#665');
 const fx=SET.f2right;rect(dx+g,0,dz,dy,'#b9a684','#665');rect(-g-dz,0,dz,dy,'#b9a684','#665');
 ctx.fillStyle='#9aa7b4';ctx.font='12px sans-serif';ctx.textAlign='center';
 const lab=(t,p)=>{const q=W2S(p);ctx.fillText(t,q.x,q.y)};
 lab('F4 перед',{x:dx/2,y:-g-dz-6/s-8/s});lab('F5 зад',{x:dx/2,y:dy+g+dz+14/s});
 lab(fx?'F2':'F3',{x:dx+g+dz/2,y:dy+12/s});lab(fx?'F3':'F2',{x:-g-dz/2,y:dy+12/s});
 // ноль
 const o=W2S({x:0,y:0});ctx.fillStyle='#ff5d5d';ctx.beginPath();ctx.arc(o.x,o.y,4,0,7);ctx.fill();ctx.fillText('0 '+(model.origin||''),o.x-14,o.y+(SET.flipY?-6:14));
 ctx.fillStyle='#e8edf2';ctx.font='bold 13px sans-serif';lab(`${f1(dx)} × ${f1(dy)} × ${f1(dz)}`,{x:dx/2,y:dy/2});
 // фрезеровки
 for(const e of model.els){if(e.type!='path'||!visible(e))continue;
  for(const sg of e.segs){if(sg.li>step)continue;const through=sg.z>=dz;const off=offsetPath(sg.pts,e.d/2,e.C);
   ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=sg.li==sel||e.li==sel||hl.has(sg.li)||hl.has(e.li)?'rgba(80,160,255,.75)':through?'rgba(220,60,50,.6)':'rgba(255,150,40,.45)';ctx.lineWidth=Math.max(2,e.d*s);
   ctx.beginPath();off.forEach((p,i)=>{const q=W2S(faceMap(e.F,p.x,p.y));i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();
   ctx.strokeStyle='#fff8';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();sg.pts.forEach((p,i)=>{const q=W2S(faceMap(e.F,p.x,p.y));i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([]);
  }
  const st=W2S(faceMap(e.F,e.start.x,e.start.y));ctx.fillStyle='#ffa657';ctx.beginPath();ctx.arc(st.x,st.y,4,0,7);ctx.fill();
  if(s>0.4){ctx.fillStyle='#ffa657';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('T'+e.T+(e.C?' C'+e.C:'')+(TOOL_NAMES[e.T]?' '+TOOL_NAMES[e.T]:'')+' ⌀'+f1(e.d),st.x+6,st.y-6)}
 }
 // отверстия
 for(const e of model.els){if(e.type!='hole'||!visible(e))continue;
  const p=W2S(faceMap(e.F,e.x,e.y));const r=Math.max(2.5,e.d/2*s);const isSel=e.li==sel||hl.has(e.li);
  if(e.F!=1){const dl=holeDepthLine(e);if(dl){const a=W2S(dl[0]),b=W2S(dl[1]);ctx.strokeStyle=holeColor(e);ctx.lineWidth=Math.max(2,e.d*s);ctx.globalAlpha=.55;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.globalAlpha=1}}
  ctx.fillStyle=holeColor(e);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fill();
  ctx.strokeStyle=isSel?'#fff':'#0008';ctx.lineWidth=isSel?3:1;ctx.stroke();
  if(e.n=='L'||e.z>=dz){ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.x-r*.7,p.y-r*.7);ctx.lineTo(p.x+r*.7,p.y+r*.7);ctx.moveTo(p.x+r*.7,p.y-r*.7);ctx.lineTo(p.x-r*.7,p.y+r*.7);ctx.stroke()}
  if(s>1.2){ctx.fillStyle='#e8edf2';ctx.font='11px sans-serif';ctx.textAlign='left';ctx.fillText('⌀'+f1(e.d)+'×'+f1(e.z),p.x+r+3,p.y-3)}
 }
 // размеры выбранного
 if(sel>=0){const hs=model.els.filter(e=>e.li==sel&&e.type=='hole'&&e.F==1&&visible(e));for(const e of hs)dims(e.x,e.y)}
 // измерение
 if(meas.length){ctx.strokeStyle='#ff0';ctx.fillStyle='#ff0';ctx.lineWidth=2;const q=meas.map(W2S);ctx.beginPath();q.forEach((p,i)=>{i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y);});ctx.stroke();q.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()});
  if(meas.length==2){const [a,b]=meas;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(`${f1(Math.hypot(b.x-a.x,b.y-a.y))}  (Δx ${f1(b.x-a.x)}  Δy ${f1(b.y-a.y)})`,(q[0].x+q[1].x)/2,(q[0].y+q[1].y)/2-10)}}
}
function dims(x,y){ctx.strokeStyle='#fffb';ctx.fillStyle='#fff';ctx.lineWidth=1;ctx.setLineDash([3,3]);ctx.font='bold 12px sans-serif';ctx.textAlign='center';
 const p=W2S({x,y}),a=W2S({x:0,y}),b=W2S({x,y:0}),c=W2S({x:model.dx,y}),d=W2S({x,y:model.dy});
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(c.x,c.y);ctx.moveTo(b.x,b.y);ctx.lineTo(d.x,d.y);ctx.stroke();ctx.setLineDash([]);
 const bg=(t,X,Y)=>{const w=ctx.measureText(t).width+6;ctx.fillStyle='#000c';ctx.fillRect(X-w/2,Y-9,w,16);ctx.fillStyle='#fff';ctx.fillText(t,X,Y+4)};
 bg('X '+f1(x),(a.x+p.x)/2,p.y-12);bg(f1(model.dx-x),(c.x+p.x)/2,p.y-12);bg('Y '+f1(y),p.x+30,(b.y+p.y)/2);bg(f1(model.dy-y),p.x+30,(d.y+p.y)/2)}

// ====== ВЫБОР КАСАНИЕМ ======
function pick(sx,sy){if(!model)return -1;let best=-1,bd=18;
 for(const e of model.els){if(!visible(e))continue;
  if(e.type=='hole'){const p=W2S(faceMap(e.F,e.x,e.y));const d=Math.hypot(p.x-sx,p.y-sy)-Math.max(0,e.d/2*view.s);if(d<bd){bd=d;best=e.li}}
  else for(const sg of e.segs){if(sg.li>step)continue;const pts=sg.pts.map(p=>W2S(faceMap(e.F,p.x,p.y)));for(let i=0;i<pts.length-1;i++){const d=segDist(sx,sy,pts[i],pts[i+1])-e.d/2*view.s;if(d<bd){bd=d;best=sg.li}}}}

function segDist(x,y,a,b){const dx=b.x-a.x,dy=b.y-a.y,L=dx*dx+dy*dy;let t=L?((x-a.x)*dx+(y-a.y)*dy)/L:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a.x-t*dx,y-a.y-t*dy)}

// ====== ЖЕСТЫ: перетаскивание, щипок, колесо ======
const ptrs=new Map();let pinch=null,moved=false,downAt=null,lastTap=0;

cv.addEventListener('pointermove',e=>{const old=ptrs.get(e.pointerId);
 if(model){const w=S2W(e.offsetX,e.offsetY);$('hud').textContent=`X ${f1(w.x)}  Y ${f1(w.y)}  · ${view.s.toFixed(2)} px/мм`}

  view.s=pinch.s*k;view.ox=cx-(pinch.cx-pinch.ox)*k;view.oy=cy-(pinch.cy-pinch.oy)*k;draw()}

// Wymiary jak w tools\fusion_cnc.py i технология-KaPi.md: kołek Ø8×12 (czoło ×28), konfirmat Ø7 na wylot (czoło Ø4,8×41),
// konfirmaty 64 od końców (+ co ≤450), kołki 32 od końców (+ środkowy >400); zawias: płytka Y=37 ±16 Ø5×12, puszka Ø35×13 Y=22,5,
// śruby puszki Ø8×11,5 (Y=32, ±22,5); półki Ø5×10, 37 od krawędzi, 3 otw. co 32; prowadnice Ø5×12 Y=37 i 261.
function normCmd(t){return t.toLowerCase().replace(/[ąćęłńóśźż]/g,c=>({'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'})[c]).replace(/(\d),(\d)/g,'$1.$2').replace(/ё/g,'е')}
function jointPos(L){if(L<160)return {konf:[L/2],kol:[]};const n=Math.max(1,Math.ceil((L-128)/450));const konf=[];for(let i=0;i<=n;i++)konf.push(64+(L-128)*i/n);
 const kol=[32,L-32];if(L>400)kol.push(n%2?L/2:(konf[n/2-1]+konf[n/2])/2);return {konf,kol:kol.sort((a,b)=>a-b)}}
function pxv(v,D,name){if(typeof v=='string')return v;if(D&&Math.abs(v-D/2)<0.01)return name+'/2';if(D&&v>D/2&&v<=D)return name+'-'+f1(D-v);return f1(v)}
function runCmd(raw){
 if(!model||!model.dx)return {err:'Сначала откройте программу (нужна строка H с DX DY DZ)'};
 const dx=model.dx,dy=model.dy,dz=model.dz;let t=' '+normCmd(raw)+' ';
 const has=re=>re.test(t);const take=re=>{const m=re.exec(t);if(!m)return null;t=t.replace(m[0],' ');return m};
 const num=v=>parseFloat(v);
 // теги
 let m;const size=take(/(\d+\.?\d*)\s*[x×х\*]\s*(\d+\.?\d*)/);

const PL_KEYS=Object.keys(PL).sort((a,b)=>b.length-a.length);
function tr(t){if(SET.lang!=='pl'||t==null)return t;t=String(t);if(!/[А-Яа-яЁё]/.test(t))return t;for(const k of PL_KEYS)if(t.includes(k))t=t.split(k).join(PL[k]);return t}
function trNode(root){if(SET.lang!=='pl')return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);let n=root;
 while(n){if(n.nodeType==3){if(!n.parentElement||!n.parentElement.closest('.ln,textarea,#title')){const v=tr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}}
  else{for(const a of ['title','placeholder']){const v=n.getAttribute&&n.getAttribute(a);if(v){const q=tr(v);if(q!==v)n.setAttribute(a,q)}}}n=w.nextNode()}}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes)if(n.nodeType==1||n.nodeType==3)trNode(n.nodeType==3?n.parentNode:n)}).observe(document.body,{childList:true,subtree:true,characterData:false});
{const ft=CanvasRenderingContext2D.prototype.fillText;CanvasRenderingContext2D.prototype.fillText=function(t,...a){return ft.call(this,tr(t),...a)};
 const mt=CanvasRenderingContext2D.prototype.measureText;CanvasRenderingContext2D.prototype.measureText=function(t){return mt.call(this,tr(t))};
 const cf=window.confirm,pr=window.prompt;window.confirm=m=>cf(tr(m));window.prompt=(m,d)=>pr(tr(m),d)}
function applyLang(){document.documentElement.lang=SET.lang;$('bLang').textContent=SET.lang=='pl'?'PL':'RU';document.title=tr('XXL – просмотр Xilog');
 if(SET.lang=='pl')trNode(document.body);else location.reload()}
$('bLang').onclick=()=>{SET.lang=SET.lang=='pl'?'ru':'pl';saveSet();if(SET.lang=='pl'){applyLang();refresh()}else location.reload()};

if(last){doc.cp1250=!!last.cp;loadText(last.text,last.name,last.path)}else renderPane();

if('serviceWorker' in navigator&&(location.protocol=='https:'||location.hostname=='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
